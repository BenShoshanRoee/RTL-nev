# First real task (sub-chunk 2.2.3). Fixtures: 16 agent-draft plus 15 written blind by a separate
# agent (author: plan-agent). Routing fields (suite, split, difficulty_target, version) per 2.2.4;
# the directory name is the id's segments after the suite joined by "_".
id: he.commerce.cart.add_two_apply_welcome10
suite: commerce
domain: commerce
split: train
difficulty_target: L1
version: 1
setup:
  domain: commerce
  seed: 42
  state_ref: commerce/seed-42
description_template:
  he: "הוסיפו 2 יחידות של {product} לעגלה והחילו את קוד הקופון WELCOME10"
  en: "Add 2 units of {product} to the cart and apply coupon WELCOME10"
milestones:
  - kind: field_equals
    path: [cart, lines, l00005, quantity]
    expected: 2
  - kind: field_equals
    path: [cart, couponCode]
    expected: WELCOME10
goal_matchers:
  - kind: count_is
    path: [cart, lines]
    expected: 1
  - kind: field_equals
    path: [cart, lines, l00005, variantId]
    expected: v0001
  - kind: field_equals
    path: [cart, lines, l00005, quantity]
    expected: 2
  - kind: field_equals
    path: [cart, couponCode]
    expected: WELCOME10
  - kind: money_equals
    path: [cart, totals, discount]
    minor: 4870
    currency: ILS
unchanged_subtrees:
  - [orders]
  - [addresses]
  - [customer]
  - [inventory]
  - [saved]
  - [returns]
  - [paymentMethods]
  - [coupons]   # the whole subtree: burning ONESHOT or any other coupon is a side effect (red-team finding #1)
cheat_surface:
  - "Add the right product in the wrong quantity (1 or 3) and declare done."
  - "Add a sibling variant (wrong size or colour) of the right product."
  - "Add the right line twice as two cart lines instead of one line with quantity 2."
  - "Apply a different, more generous coupon (SAVE20) that also shows a discount."
  - "Apply the coupon, then save the line for later so the cart looks clean."
  - "Reach the cart goal while also cancelling or editing an existing order or address."
  - "Declare done immediately without touching the cart."
  - "Reach the cart goal while consuming an unrelated coupon (ONESHOT) or otherwise touching coupon state the task never named."

[project]
name = "rtl-environments-workspace"
version = "0.0.0"
description = "uv workspace root for the RTL environments bench layer. Not a package."
requires-python = ">=3.11"
dependencies = [
  "rtlenv",
  "rtl-commerce",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bench", "packages_py/rtl_commerce"]

[tool.uv.sources]
rtlenv = { workspace = true }
rtl-commerce = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["bench/tests", "packages_py/rtl_commerce/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["sim", "refs", "docs/business"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

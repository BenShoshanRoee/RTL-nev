# Local composite action: identical toolchain setup for every CI job. Node comes from
# .node-version, Python from .python-version, both workspaces from their lockfiles.
name: Set up workspaces
description: pnpm + Node (pinned), uv + Python (pinned), then make setup from lockfiles
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Set up Node (version from .node-version)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Set up uv (Python from .python-version)
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
    - name: Install workspaces from lockfiles
      run: make setup
      shell: bash

# Licence firewall. Runs the identical command the operator runs locally (make licence) so
# the two outputs are byte-comparable. Every action is pinned to a commit SHA, not a tag.
name: licence-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: licence-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence:
    name: NC guard, dependency licences, brand guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up uv (Python from .python-version / pyproject)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install workspaces from lockfiles
        run: make setup

      - name: Licence firewall
        run: make licence

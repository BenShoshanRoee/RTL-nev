# Licence firewall. Runs the identical command the operator runs locally (make licence) so
# the two outputs are byte-comparable. Called by ci.yml on every push and pull request; runs
# on its own for release tags. Every action is pinned to a commit SHA, not a tag.
name: licence-gate

on:
  workflow_call:      # ci.yml runs this as its licence job
  push:
    tags: ["v*"]      # a release must never ship with a licence finding

permissions:
  contents: read

concurrency:
  group: licence-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence:
    name: NC guard, dependency licences, brand guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Licence firewall
        run: make licence

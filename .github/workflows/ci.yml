# CI on every pull request and on main. lint first; test-js, test-py, licence and sbom in
# parallel; build-sim; then an end-to-end smoke of the built simulator. Every job runs the
# same make targets the operator runs locally. Actions pinned to commit SHAs.
# Branches run through their pull request only, so each change is checked once, not twice.
name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]   # tags run release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: make verify-tree
      - run: make lint

  test-js:
    name: test-js
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: make test-js

  test-py:
    name: test-py
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: make test-py
      - run: make gates

  licence:
    name: licence
    needs: [lint]
    uses: ./.github/workflows/licence-gate.yml

  sbom:
    name: sbom
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: make sbom
      - name: Upload SBOM (CycloneDX 1.5, JS + Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

  build-sim:
    name: build-sim
    needs: [test-js, test-py]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm -r build
      - name: Upload simulator build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-dist
          path: sim/dist
          if-no-files-found: error

  e2e-smoke:
    name: e2e-smoke
    needs: [build-sim]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sim-dist
          path: sim/dist
      - run: make smoke
